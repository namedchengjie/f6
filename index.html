<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO BRICK BREAKER - CLEAR UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #121212;
            --console-body: #c0c0b0; 
            --red-button: #a80000;
            --screen-bg: #000000;
            --text-color: #f0f0f0;
            --neon-green: #39ff14;
            --gold: #ffeb3b;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', cursive;
            color: var(--text-color);
            overflow: hidden;
            text-rendering: optimizeSpeed;
            -webkit-font-smoothing: none;
        }

        #game-container {
            position: relative;
            padding: 35px;
            background-color: var(--console-body);
            border-radius: 12px;
            box-shadow: 0 15px 0 #8a8a7a, 0 25px 50px rgba(0,0,0,0.8);
            border: 5px solid #e0e0d0;
            margin: 10px;
        }

        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #333;
            font-size: 10px;
            padding: 0 4px;
            width: 640px;
        }

        .header-item { flex: 1; }
        .text-center { text-align: center; }
        .text-right { text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 15px; }

        #quit-btn {
            background: #444;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            border-bottom: 2px solid #222;
        }
        #quit-btn:hover { background: #666; }
        #quit-btn:active { border-bottom: 0; transform: translateY(2px); }

        canvas {
            display: block;
            background-color: var(--screen-bg);
            border: 10px solid #1a1a1a;
            image-rendering: pixelated;
            width: 640px;
            height: 480px;
        }

        #overlay {
            position: absolute;
            top: 35px; left: 35px; right: 35px; bottom: 35px;
            background: rgba(0, 0, 0, 0.96); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            border: 4px double #444;
        }

        .hidden { display: none !important; }

        /* 优化后的标题样式，减少了阴影偏移防止重影 */
        h1 { 
            font-size: 24px; 
            margin-bottom: 20px; 
            color: var(--gold); 
            text-shadow: 2px 2px #a80000; /* 原为 4px 4px，现改为 2px 减少重影 */
            letter-spacing: 2px;
            text-align: center;
        }
        
        #level-info { 
            color: var(--neon-green); 
            font-size: 10px; 
            margin-bottom: 15px;
            text-align: center;
        }

        input {
            background: #000;
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            text-align: center;
            margin-bottom: 15px;
            width: 220px;
            outline: none;
            text-transform: uppercase;
        }

        #leaderboard {
            width: 85%;
            margin: 10px 0;
            font-size: 10px;
            color: var(--neon-green);
            border-top: 3px solid #333;
            border-bottom: 3px solid #333;
            padding: 12px 0;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .action-btn {
            margin-top: 15px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            background-color: var(--red-button);
            color: white;
            border: none;
            border-bottom: 6px solid #500000;
            cursor: pointer;
        }

        .action-btn:active { border-bottom: 0; transform: translateY(6px); }
        
        .blink {
            animation: blinker 1.5s linear infinite;
            color: #fff;
            font-size: 12px;
            position: absolute;
            top: 60%;
            pointer-events: none;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-header">
            <div id="score-display" class="header-item">SCORE: 0000</div>
            <div id="stage-display" class="header-item text-center" style="color: #a80000;">STAGE: 1</div>
            <div id="lives-display" class="header-item text-right">
                <span id="lives-text">LIVES: 3</span>
                <button id="quit-btn" class="hidden">QUIT</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="serve-prompt" class="blink hidden">PRESS SPACE TO SERVE</div>

        <div id="overlay">
            <h1 id="status-title">ARCADE BRICK</h1>
            <div id="level-info">READY?</div>
            
            <div id="setup-section">
                <p style="font-size: 8px; color: #888; margin-bottom: 10px; text-align: center;">NAME (A-Z, 0-9 ONLY):</p>
                <input type="text" id="name-input" maxlength="8" placeholder="PLAYER 1" autocomplete="off" 
                       oninput="this.value = this.value.replace(/[^a-zA-Z0-9 ]/g, '').toUpperCase()">
            </div>

            <div id="leaderboard">
                <div style="text-align:center; color:#fff; font-size:9px; margin-bottom:10px;">-- HALL OF FAME --</div>
                <div id="score-list"></div>
            </div>

            <button id="start-btn" class="action-btn">PUSH START</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score-display");
        const stageEl = document.getElementById("stage-display");
        const livesEl = document.getElementById("lives-text");
        const quitBtn = document.getElementById("quit-btn");
        const overlay = document.getElementById("overlay");
        const startBtn = document.getElementById("start-btn");
        const nameInput = document.getElementById("name-input");
        const setupSection = document.getElementById("setup-section");
        const statusTitle = document.getElementById("status-title");
        const levelInfoEl = document.getElementById("level-info");
        const scoreListEl = document.getElementById("score-list");
        const servePrompt = document.getElementById("serve-prompt");

        const paddleHeight = 12;
        const paddleWidth = 100;
        let paddleX = (canvas.width - paddleWidth) / 2;

        let balls = [];
        const ballRadius = 5;
        
        let baseSpeed = 4;
        let currentLevel = 1;

        let rightPressed = false;
        let leftPressed = false;
        let spacePressed = false;

        const brickRowCount = 7;
        const brickColumnCount = 10;
        const brickWidth = 54;
        const brickHeight = 20;
        const brickPadding = 5;
        const brickOffsetTop = 50;
        const brickOffsetLeft = (canvas.width - (brickColumnCount * (brickWidth + brickPadding))) / 2;
        let bricks = [];

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let isServing = true; 
        let animationId = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, endFreq = null) {
            try {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (endFreq) {
                    osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
                }
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function getScores() {
            const data = localStorage.getItem('arcade_brick_ranking');
            return data ? JSON.parse(data) : [];
        }

        function saveScore(name, finalScore) {
            let scores = getScores();
            const entry = { name: name.trim() || "NONAME", score: finalScore };
            scores.push(entry);
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 5);
            localStorage.setItem('arcade_brick_ranking', JSON.stringify(scores));
            updateLeaderboardUI();
        }

        function updateLeaderboardUI() {
            const scores = getScores();
            if (scores.length === 0) {
                scoreListEl.innerHTML = '<div style="text-align:center; color:#333; font-size:8px;">VACANT</div>';
                return;
            }
            scoreListEl.innerHTML = scores.map((s, i) => `
                <div class="score-row">
                    <span>${i + 1}.${s.name}</span>
                    <span>${s.score.toString().padStart(4, '0')}</span>
                </div>
            `).join('');
        }

        function initGame(isNewLevel) {
            if (!isNewLevel) {
                score = 0;
                lives = 3;
                currentLevel = 1;
                baseSpeed = 4;
            } else {
                baseSpeed *= 1.05; 
                currentLevel++;
            }

            paddleX = (canvas.width - paddleWidth) / 2;
            resetBallOnPaddle();
            
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    let isSpecial = Math.random() < 0.12;
                    bricks[c][r] = { 
                        x: 0, y: 0, status: 1, 
                        color: isSpecial ? "#ffffff" : `hsl(${r * 45}, 65%, 50%)`,
                        type: isSpecial ? "split" : "normal"
                    };
                }
            }
            updateUI();
        }

        function resetBallOnPaddle() {
            isServing = true;
            balls = [{ 
                x: paddleX + paddleWidth / 2, 
                y: canvas.height - paddleHeight - 15 - ballRadius, 
                dx: baseSpeed, 
                dy: -baseSpeed 
            }];
            servePrompt.classList.remove("hidden");
        }

        function updateUI() {
            scoreEl.textContent = `SCORE: ${score.toString().padStart(4, '0')}`;
            stageEl.textContent = `STAGE: ${currentLevel}`;
            livesEl.textContent = `LIVES: ${lives}`;
        }

        quitBtn.addEventListener("click", () => {
            stopGameCycle();
            quitBtn.classList.add("hidden");
            servePrompt.classList.add("hidden");
            statusTitle.textContent = "ARCADE BRICK";
            statusTitle.style.color = "var(--gold)";
            levelInfoEl.textContent = "READY?";
            setupSection.classList.remove("hidden");
            startBtn.textContent = "PUSH START";
            overlay.classList.remove("hidden");
            updateLeaderboardUI();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
            else if (e.code === "Space") {
                spacePressed = true;
                if (gameRunning && isServing) {
                    isServing = false;
                    servePrompt.classList.add("hidden");
                    playTone(600, 'square', 0.1); 
                }
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
            else if (e.code === "Space") spacePressed = false;
        });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const relativeX = (e.clientX - rect.left) * scaleX;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
                if (isServing && balls.length > 0) {
                    balls[0].x = relativeX;
                }
            }
        });

        startBtn.addEventListener("click", () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const isNextLevel = (statusTitle.textContent === "STAGE CLEAR");
            overlay.classList.add("hidden");
            quitBtn.classList.remove("hidden");
            
            if (animationId) cancelAnimationFrame(animationId);
            
            initGame(isNextLevel);
            gameRunning = true;
            draw();
        });

        function stopGameCycle() {
            gameRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        function draw() {
            if (!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.02)";
            for (let i = 0; i < canvas.height; i += 4) ctx.fillRect(0, i, canvas.width, 1);

            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        const bx = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const by = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        b.x = bx; b.y = by;
                        ctx.beginPath();
                        ctx.rect(bx, by, brickWidth, brickHeight);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }

            balls.forEach((b, i) => {
                ctx.beginPath();
                ctx.rect(b.x - ballRadius, b.y - ballRadius, ballRadius * 2, ballRadius * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
                ctx.closePath();

                if (isServing) {
                    b.x = paddleX + paddleWidth / 2;
                    b.y = canvas.height - paddleHeight - 15 - ballRadius;
                    return;
                }

                if (b.x + b.dx > canvas.width - ballRadius || b.x + b.dx < ballRadius) b.dx = -b.dx;
                if (b.y + b.dy < ballRadius) b.dy = -b.dy;
                else if (b.y + b.dy > canvas.height - ballRadius - 15) {
                    if (b.x > paddleX && b.x < paddleX + paddleWidth) {
                        let hitPoint = (b.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
                        b.dy = -Math.abs(b.dy);
                        b.dx = hitPoint * baseSpeed * 0.8; 
                        playTone(300, 'square', 0.05);
                    } else if (b.y > canvas.height) {
                        balls.splice(i, 1);
                        if (balls.length === 0) {
                            lives--;
                            updateUI();
                            playTone(150, 'sawtooth', 0.5, 50); 
                            
                            if (lives <= 0) {
                                stopGameCycle();
                                quitBtn.classList.add("hidden");
                                servePrompt.classList.add("hidden");
                                statusTitle.textContent = "GAME OVER";
                                statusTitle.style.color = "#a80000";
                                levelInfoEl.textContent = `FINAL SCORE: ${score}`;
                                setupSection.classList.remove("hidden");
                                startBtn.textContent = "RETRY";
                                saveScore(nameInput.value, score);
                                overlay.classList.remove("hidden");
                            } else {
                                resetBallOnPaddle();
                            }
                        }
                    }
                }

                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        let bk = bricks[c][r];
                        if (bk.status === 1) {
                            if (b.x > bk.x && b.x < bk.x + brickWidth && b.y > bk.y && b.y < bk.y + brickHeight) {
                                b.dy = -b.dy;
                                bk.status = 0;
                                score += 1;
                                updateUI();
                                if (bk.type === "split" && balls.length < 3) { 
                                    balls.push({ x: b.x, y: b.y, dx: -b.dx, dy: b.dy });
                                }
                                playTone(400 + (r * 20), 'square', 0.05);
                            }
                        }
                    }
                }
                b.x += b.dx; b.y += b.dy;
            });

            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 15, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ffeb3b";
            ctx.fill();
            ctx.closePath();

            if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 9;
            else if (leftPressed && paddleX > 0) paddleX -= 9;

            if (activeBricks === 0) {
                stopGameCycle();
                quitBtn.classList.add("hidden");
                servePrompt.classList.add("hidden");
                statusTitle.textContent = "STAGE CLEAR";
                statusTitle.style.color = "#39ff14";
                levelInfoEl.textContent = "PREPARE FOR NEXT";
                setupSection.classList.add("hidden");
                startBtn.textContent = "NEXT STAGE";
                overlay.classList.remove("hidden");
                playTone(800, 'sine', 0.3, 1200); 
            } else {
                animationId = requestAnimationFrame(draw);
            }
        }

        updateLeaderboardUI();
    </script>
</body>
</html>
